<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha do livro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06060f; --bg-card:#0e0e1c; --gold:#D4A04C; --gold-dim:#8a6d38; --gold-soft:rgba(212,160,76,.12);
    --text:#eae7de; --text-dim:#8b8a9a; --line:#1c1c2e;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; min-height:100vh; }
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(212,160,76,.09), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 100%, rgba(138,109,56,.07), transparent 60%),
      var(--bg);
    color:var(--text); font-family:'DM Sans',sans-serif;
  }
  .wrap{ max-width:560px; margin:0 auto; padding:28px 20px 60px; animation:subir .5s cubic-bezier(.2,.7,.3,1); }
  @keyframes subir{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes girar{ to{ transform:rotate(360deg); } }

  .stamp-row{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px dashed var(--line); padding-bottom:16px; margin-bottom:26px; gap:10px; }
  .stamp{ font-family:'DM Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--gold-dim); text-transform:uppercase; border:1px solid var(--gold-dim); padding:5px 9px; border-radius:3px; transform:rotate(-2deg); }
  .stamp.editavel{ color:var(--gold); border-color:var(--gold); box-shadow:0 0 16px -4px rgba(212,160,76,.55); }
  .stamp-right{ display:flex; align-items:center; gap:10px; }
  .id-num{ font-family:'DM Mono',monospace; font-size:11px; color:var(--text-dim); }

  button{ font-family:inherit; transition:transform .12s ease, filter .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease; }
  button:active{ transform:scale(.94); }

  .compartilhar-btn{ background:none; border:1px solid var(--gold-dim); color:var(--gold); border-radius:6px; padding:5px 11px; font-size:11px; cursor:pointer; white-space:nowrap; }
  .compartilhar-btn:hover{ background:var(--gold-soft); }

  .btn-ouro{ background:linear-gradient(180deg, #e2b563, var(--gold)); color:#241a08; border:none; border-radius:7px; padding:9px 16px; font-weight:700; cursor:pointer; font-size:13px; box-shadow:0 4px 14px -4px rgba(212,160,76,.5); }
  .btn-ouro:hover{ filter:brightness(1.08); }

  .capa-wrap{ text-align:center; margin-bottom:24px; }
  .capa-img{ max-width:170px; max-height:250px; border-radius:6px 10px 10px 6px; box-shadow:-6px 10px 28px -8px rgba(0,0,0,.6), 0 0 0 1px var(--line); border-left:4px solid var(--gold-dim); }

  h1{ font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:46px; line-height:0.95; margin:0 0 8px; letter-spacing:.3px; text-shadow:0 2px 24px rgba(212,160,76,.18); }
  .autor{ color:var(--gold); font-size:15px; margin:0 0 20px; letter-spacing:.3px; }

  .editar-toggle{ background:none; border:1px dashed var(--line); color:var(--text-dim); border-radius:6px; padding:5px 11px; font-size:11px; cursor:pointer; margin:-10px 0 20px; }
  .editar-toggle:hover{ border-color:var(--gold-dim); color:var(--gold); }
  .editar-cabecalho{ display:flex; flex-direction:column; gap:8px; margin-bottom:24px; background:var(--bg-card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .editar-cabecalho input, .editar-cabecalho textarea{ padding:9px 11px; background:var(--bg); border:1px solid var(--line); border-radius:6px; color:var(--text); font-size:14px; font-family:inherit; }
  .editar-cabecalho input:focus, .editar-cabecalho textarea:focus, .diario-form input:focus, .diario-form textarea:focus, .progress-edit input:focus, .emprestimo-form input:focus, .tags-edit input:focus{ outline:none; border-color:var(--gold-dim); box-shadow:0 0 0 3px var(--gold-soft); }
  .editar-cabecalho textarea{ min-height:70px; }
  .editar-cabecalho label{ font-family:'DM Mono',monospace; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
  .editar-cabecalho button{ align-self:flex-start; }

  .sinopse{ font-size:15px; line-height:1.7; margin-bottom:26px; color:#d8d6cd; }

  .status-pills{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .status-pill{ font-family:'DM Mono',monospace; font-size:11px; padding:7px 14px; border-radius:20px; border:1px solid var(--line); color:var(--text-dim); background:none; }
  .status-pill.ativo{ border-color:var(--gold); color:#241a08; background:linear-gradient(180deg,#e2b563,var(--gold)); font-weight:700; }
  .status-pill.clicavel{ cursor:pointer; }
  .status-pill.clicavel:hover:not(.ativo){ border-color:var(--gold-dim); color:var(--gold); }

  .estrelas{ display:flex; gap:5px; margin-bottom:18px; font-size:21px; line-height:1; }
  .estrela{ color:#2a2a40; transition:color .12s ease, transform .12s ease; }
  .estrela.cheia{ color:var(--gold); text-shadow:0 0 12px rgba(212,160,76,.5); }
  .estrela.clicavel{ cursor:pointer; }
  .estrela.clicavel:hover{ transform:scale(1.2); }

  .tags-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .tag{ font-family:'DM Mono',monospace; font-size:11px; color:var(--gold); background:var(--gold-soft); border:1px solid var(--gold-dim); padding:4px 11px; border-radius:20px; }
  .tags-edit{ display:flex; gap:8px; margin-bottom:26px; }
  .tags-edit input{ flex:1; padding:8px 10px; background:var(--bg-card); border:1px solid var(--line); border-radius:6px; color:var(--text); font-size:13px; }
  .tags-edit button{ background:var(--gold); color:var(--bg); border:none; border-radius:6px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:12px; white-space:nowrap; }

  section{ margin-bottom:36px; }
  .section-title{ font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:1px; color:var(--gold); margin:0 0 16px; display:flex; align-items:center; gap:10px; }
  .section-title::after{ content:''; flex:1; height:1px; background:linear-gradient(90deg, var(--line), transparent); }
  .section-icon{ width:22px; height:22px; border:1px solid var(--gold-dim); border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--gold); background:var(--gold-soft); }
  .section-icon svg{ width:12px; height:12px; }

  .progress-box{ background:linear-gradient(180deg, var(--bg-card), #0b0b18); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .progress-top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
  .progress-pct{ font-family:'DM Mono',monospace; font-size:30px; color:var(--gold); font-weight:500; }
  .progress-num{ font-family:'DM Mono',monospace; font-size:12px; color:var(--text-dim); text-align:right; }
  .progress-num b{ color:var(--text); font-weight:500; }
  .bar-track{ height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar-fill{ height:100%; background:linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius:4px; transition:width .6s cubic-bezier(.2,.8,.2,1); box-shadow:0 0 10px rgba(212,160,76,.5); }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
  .stat-chip{ background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 6px; text-align:center; }
  .stat-valor{ font-family:'DM Mono',monospace; font-size:14px; color:var(--gold); display:block; }
  .stat-legenda{ font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; margin-top:3px; display:block; }
  .progress-edit{ display:flex; gap:8px; margin-top:16px; align-items:center; }
  .progress-edit input{ width:80px; padding:9px 10px; background:var(--bg); border:1px solid var(--line); border-radius:6px; color:var(--text); font-size:14px; }
  .progress-edit button{ padding:9px 15px; font-size:13px; }

  .diario-item, .citacao-item{ display:flex; gap:14px; padding:14px 4px; border-bottom:1px solid var(--line); border-radius:6px; }
  .diario-item:hover, .citacao-item:hover{ background:rgba(255,255,255,.015); }
  .diario-item:last-child, .citacao-item:last-child{ border-bottom:none; }
  .diario-data{ font-family:'DM Mono',monospace; font-size:11px; color:var(--gold-dim); white-space:nowrap; padding-top:2px; }
  .diario-nota{ font-size:14px; line-height:1.5; }
  .diario-pag{ display:block; font-size:11px; color:var(--text-dim); margin-top:4px; }
  .diario-form{ margin-top:16px; display:flex; flex-direction:column; gap:9px; }
  .diario-form input, .diario-form textarea{ padding:10px 12px; background:var(--bg-card); border:1px solid var(--line); border-radius:8px; color:var(--text); font-size:14px; font-family:inherit; }
  .diario-form button{ align-self:flex-start; padding:9px 17px; font-size:13px; }

  .citacao-item{ flex-direction:column; gap:4px; padding:14px 4px; }
  .citacao-texto{ font-size:14px; line-height:1.65; font-style:italic; color:#d8d6cd; }
  .citacao-texto::before{ content:'\201C'; color:var(--gold-dim); }
  .citacao-texto::after{ content:'\201D'; color:var(--gold-dim); }
  .citacao-pag{ display:block; font-size:11px; color:var(--text-dim); font-style:normal; }

  .card-ficha{ background:linear-gradient(180deg, var(--bg-card), #0b0b18); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .ficha-row{ display:flex; justify-content:space-between; align-items:center; padding:14px 17px; font-size:13px; border-bottom:1px solid var(--line); }
  .ficha-row:last-child{ border-bottom:none; }
  .ficha-status{ font-family:'DM Mono',monospace; font-size:11px; display:flex; align-items:center; gap:8px; }
  .status-fora{ color:var(--gold); }
  .status-devolvido{ color:var(--text-dim); }
  .vazio{ color:var(--text-dim); font-size:13px; font-style:italic; padding:16px 17px; }
  .emprestimo-form{ display:flex; gap:8px; padding:13px 17px; }
  .emprestimo-form input{ flex:1; padding:9px 11px; background:var(--bg); border:1px solid var(--line); border-radius:7px; color:var(--text); font-size:13px; }
  .emprestimo-form button{ padding:9px 15px; font-size:12px; white-space:nowrap; }
  .devolver-btn{ background:none; border:1px solid var(--gold-dim); color:var(--gold); border-radius:5px; padding:4px 9px; font-size:11px; cursor:pointer; }
  .devolver-btn:hover{ background:var(--gold-soft); }
  .apagar-btn{ background:none; border:none; color:#9a5f5f; font-size:11px; cursor:pointer; text-decoration:underline; padding:0; }
  .apagar-btn:hover{ color:#c47a7a; }

  .precos-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .preco-card{ background:linear-gradient(180deg, var(--bg-card), #0b0b18); border:1px solid var(--line); border-radius:12px; padding:15px 10px; text-align:center; transition:border-color .15s ease, transform .15s ease; }
  .preco-card:has(a[href]:not([href="#"])):hover{ border-color:var(--gold-dim); transform:translateY(-2px); }
  .preco-loja{ font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim); margin-bottom:7px; }
  .preco-valor{ font-family:'DM Mono',monospace; font-size:15px; color:var(--gold); }
  .preco-card a{ text-decoration:none; color:inherit; display:block; }

  footer{ text-align:center; color:var(--text-dim); font-size:11px; margin-top:44px; letter-spacing:.3px; }
  .loading{ display:flex; flex-direction:column; align-items:center; gap:16px; padding:110px 20px; color:var(--text-dim); font-size:13px; font-family:'DM Mono',monospace; letter-spacing:.5px; }
  .spinner{ width:26px; height:26px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--gold); animation:girar .8s linear infinite; }
  .erro{ text-align:center; padding:90px 20px; color:var(--text-dim); font-size:14px; }
  .erro b{ color:var(--gold); display:block; margin-bottom:8px; font-family:'Bebas Neue'; font-size:24px; letter-spacing:.5px; }
  .salvando{ font-size:11px; color:var(--text-dim); }
</style>
</head>
<body>
  <div class="wrap" id="app"><div class="loading"><div class="spinner"></div>carregando ficha do livro…</div></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const key = params.get('key');
let podeEditar = false;
let docRef, livroAtual;
let editandoCabecalho = false;
let capaAuto = null;

const STATUS_LABEL = { 'quero-ler':'Quero ler', 'lendo':'Lendo', 'lido':'Lido' };

const ICONES = {
  progresso: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 0 1 2-2h13v16"/><path d="M4 19a2 2 0 0 0 2 2h14"/><path d="M4 19a2 2 0 0 1 2-2h14"/></svg>',
  diario: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  citacoes: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.2 6C4.4 7.4 3 9.6 3 12.4c0 2.1 1.2 3.6 3 3.6 1.6 0 2.8-1.2 2.8-2.8 0-1.5-1-2.6-2.4-2.7.3-1.6 1.5-2.9 3.1-3.6L7.2 6Zm9 0c-2.8 1.4-4.2 3.6-4.2 6.4 0 2.1 1.2 3.6 3 3.6 1.6 0 2.8-1.2 2.8-2.8 0-1.5-1-2.6-2.4-2.7.3-1.6 1.5-2.9 3.1-3.6L16.2 6Z"/></svg>',
  emprestimos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m17 3 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 21-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
  loja: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 4.5 4h15L21 9.5"/><path d="M3 9.5h18v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5Z"/><path d="M9 21v-5h6v5"/></svg>'
};

function escapeHtml(s){
  return String(s==null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function sha256(texto){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function formatarData(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function hoje(){ return new Date().toISOString().slice(0,10); }

async function salvar(campos){
  await docRef.update({ ...campos, chaveHash: livroAtual.chaveHash });
}

async function init(){
  const app = document.getElementById('app');
  if(!id){
    app.innerHTML = '<div class="erro"><b>Nenhum livro informado</b>Adicione ?id=slug-do-livro ao link.</div>';
    return;
  }
  docRef = db.collection('livros').doc(id);
  let snap;
  try{ snap = await docRef.get(); }
  catch(e){
    app.innerHTML = '<div class="erro"><b>Não foi possível carregar</b>Verifique a configuração do Firebase.</div>';
    return;
  }
  if(!snap.exists){
    app.innerHTML = '<div class="erro"><b>Livro não encontrado</b>Não há registro para "'+id+'".</div>';
    return;
  }
  livroAtual = snap.data();

  if(key){
    const hash = await sha256(key);
    podeEditar = (hash === livroAtual.chaveHash);
  }

  render();
  tentarCapaAutomatica();
}

async function tentarCapaAutomatica(){
  if(!livroAtual || livroAtual.capaUrl || capaAuto || !livroAtual.titulo) return;
  try{
    const q = encodeURIComponent(`intitle:${livroAtual.titulo} inauthor:${livroAtual.autor||''}`);
    const resp = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${q}&maxResults=1`);
    const json = await resp.json();
    const link = json.items && json.items[0] && json.items[0].volumeInfo && json.items[0].volumeInfo.imageLinks && json.items[0].volumeInfo.imageLinks.thumbnail;
    if(link){ capaAuto = link.replace('http://','https://'); render(); }
  }catch(e){ /* sem capa disponível, tudo bem */ }
}

function render(){
  const livro = livroAtual;
  const app = document.getElementById('app');
  const ultimaLeitura = (livro.diario && livro.diario.length) ? livro.diario[livro.diario.length-1] : null;
  const paginaAtual = ultimaLeitura ? ultimaLeitura.paginaAte : 0;
  const totalPaginas = livro.totalPaginas || 0;
  const pct = totalPaginas ? Math.min(100, Math.round((paginaAtual/totalPaginas)*100)) : 0;

  const capaSrc = livro.capaUrl || capaAuto;
  const capaHtml = capaSrc
    ? `<div class="capa-wrap"><img class="capa-img" src="${escapeHtml(capaSrc)}" alt="Capa de ${escapeHtml(livro.titulo)}" onerror="this.parentElement.style.display='none'"></div>`
    : '';

  const cabecalhoHtml = editandoCabecalho ? `
    <div class="editar-cabecalho">
      <label>Título</label>
      <input type="text" id="inputTitulo" value="${escapeHtml(livro.titulo)}">
      <label>Autor</label>
      <input type="text" id="inputAutor" value="${escapeHtml(livro.autor||'')}">
      <label>Sinopse</label>
      <textarea id="inputSinopse">${escapeHtml(livro.sinopse||'')}</textarea>
      <label>URL da capa (opcional — deixe em branco para buscar automaticamente)</label>
      <input type="text" id="inputCapa" value="${escapeHtml(livro.capaUrl||'')}">
      <button class="btn-ouro" onclick="salvarCabecalho()">Salvar detalhes</button>
    </div>`
    : `
    <h1>${escapeHtml(livro.titulo)}</h1>
    <p class="autor">${escapeHtml(livro.autor||'')}</p>
    ${podeEditar ? `<button class="editar-toggle" onclick="toggleEditarCabecalho()">✎ editar título, autor, sinopse e capa</button>` : ''}
    ${livro.sinopse ? `<p class="sinopse">${escapeHtml(livro.sinopse)}</p>` : ''}
  `;

  const statusAtual = livro.status;
  const statusHtml = podeEditar
    ? `<div class="status-pills">${Object.keys(STATUS_LABEL).map(s =>
        `<button class="status-pill clicavel ${statusAtual===s?'ativo':''}" onclick="definirStatus('${s}')">${STATUS_LABEL[s]}</button>`
      ).join('')}</div>`
    : (statusAtual ? `<div class="status-pills"><span class="status-pill ativo">${STATUS_LABEL[statusAtual]||escapeHtml(statusAtual)}</span></div>` : '');

  const avaliacao = livro.avaliacao || 0;
  const estrelasHtml = (podeEditar || avaliacao > 0) ? `
    <div class="estrelas">
      ${[1,2,3,4,5].map(n => `<span class="estrela ${n<=avaliacao?'cheia':''} ${podeEditar?'clicavel':''}" ${podeEditar?`onclick="avaliar(${n})"`:''}>★</span>`).join('')}
    </div>` : '';

  const tags = livro.tags || [];
  const tagsRowHtml = tags.length ? `<div class="tags-row">${tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : '';
  const tagsEditHtml = podeEditar ? `
    <div class="tags-edit">
      <input type="text" id="inputTags" placeholder="gêneros, separados por vírgula" value="${escapeHtml(tags.join(', '))}">
      <button onclick="salvarTags()">Salvar</button>
    </div>` : '';

  let statChips = [];
  if(totalPaginas){
    statChips.push({ valor: Math.max(0, totalPaginas - paginaAtual), legenda: 'páginas restantes' });
    if(livro.diario && livro.diario.length >= 2){
      const primeira = livro.diario[0];
      const ultima = livro.diario[livro.diario.length-1];
      const dias = Math.max(1, Math.round((new Date(ultima.data) - new Date(primeira.data)) / 86400000));
      const paginasLidas = ultima.paginaAte - primeira.paginaAte;
      const mediaPorDia = paginasLidas / dias;
      if(mediaPorDia > 0){
        statChips.push({ valor: mediaPorDia.toFixed(1), legenda: 'páginas/dia' });
        const restante = totalPaginas - paginaAtual;
        const diasRestantes = Math.ceil(restante / mediaPorDia);
        const previsao = new Date(Date.now() + diasRestantes * 86400000).toISOString().slice(0,10);
        statChips.push({ valor: formatarData(previsao), legenda: 'previsão de término' });
      }
    }
  }
  const statGridHtml = statChips.length ? `
    <div class="stat-grid">
      ${statChips.map(s => `<div class="stat-chip"><span class="stat-valor">${escapeHtml(String(s.valor))}</span><span class="stat-legenda">${s.legenda}</span></div>`).join('')}
    </div>` : '';

  const diarioHtml = (livro.diario && livro.diario.length)
    ? livro.diario.map((d, idxReal) => `
        <div class="diario-item">
          <div class="diario-data">${formatarData(d.data)}</div>
          <div class="diario-nota">${escapeHtml(d.nota||'')}<span class="diario-pag">até a página ${d.paginaAte}
            ${podeEditar ? ` · <button class="apagar-btn" onclick="apagarDiario(${idxReal})">apagar</button>` : ''}
          </span></div>
        </div>`).reverse().join('')
    : '<div class="vazio">Nenhum registro de leitura ainda.</div>';

  const citacoesHtml = (livro.citacoes && livro.citacoes.length)
    ? livro.citacoes.map((c, idxReal) => `
        <div class="citacao-item">
          <div class="citacao-texto">${escapeHtml(c.texto||'')}</div>
          <span class="citacao-pag">página ${c.pagina||'?'}
            ${podeEditar ? ` · <button class="apagar-btn" onclick="apagarCitacao(${idxReal})">apagar</button>` : ''}
          </span>
        </div>`).reverse().join('')
    : '<div class="vazio">Nenhuma citação salva ainda.</div>';

  const activeLoan = (livro.emprestimos||[]).find(e => !e.dataDevolucao);
  const emprestimosHtml = (livro.emprestimos && livro.emprestimos.length)
    ? livro.emprestimos.slice().map((e, idxReal) => {
        return `<div class="ficha-row">
          <span>${escapeHtml(e.nome)}</span>
          <span class="ficha-status ${e.dataDevolucao?'status-devolvido':'status-fora'}">
            ${e.dataDevolucao ? 'devolvido em '+formatarData(e.dataDevolucao) : 'desde '+formatarData(e.dataEmprestimo)}
            ${(!e.dataDevolucao && podeEditar) ? `<button class="devolver-btn" onclick="marcarDevolvido(${idxReal})">devolvido</button>` : ''}
            ${podeEditar ? `<button class="apagar-btn" onclick="apagarEmprestimo(${idxReal})">apagar</button>` : ''}
          </span>
        </div>`;
      }).reverse().join('')
    : '<div class="vazio">Este exemplar nunca foi emprestado.</div>';

  const c = livro.catalogo || {};
  const precoHtml = `<div class="precos-grid">
    <div class="preco-card"><a href="${c.linkAmazon||'#'}" target="_blank" rel="noopener"><div class="preco-loja">Amazon</div><div class="preco-valor">${escapeHtml(c.amazon||'—')}</div></a></div>
    <div class="preco-card"><a href="${c.linkTravessa||'#'}" target="_blank" rel="noopener"><div class="preco-loja">Travessa</div><div class="preco-valor">${escapeHtml(c.travessa||'—')}</div></a></div>
    <div class="preco-card"><a href="${c.linkEstanteVirtual||'#'}" target="_blank" rel="noopener"><div class="preco-loja">Est. Virtual</div><div class="preco-valor">${escapeHtml(c.estanteVirtual||'—')}</div></a></div>
  </div>`;

  app.innerHTML = `
    <div class="stamp-row">
      <div class="stamp ${podeEditar?'editavel':''}">${podeEditar ? 'edição liberada' : 'ficha de biblioteca'}</div>
      <div class="stamp-right">
        <div class="id-num">Nº ${id}</div>
        <button class="compartilhar-btn" id="btnCompartilhar" onclick="compartilhar()">compartilhar</button>
      </div>
    </div>

    ${capaHtml}
    ${cabecalhoHtml}
    ${statusHtml}
    ${estrelasHtml}
    ${tagsRowHtml}
    ${tagsEditHtml}

    ${totalPaginas ? `
    <section>
      <div class="section-title"><span class="section-icon">${ICONES.progresso}</span>Progresso de leitura</div>
      <div class="progress-box">
        <div class="progress-top">
          <div class="progress-pct">${pct}%</div>
          <div class="progress-num">página <b>${paginaAtual}</b> de ${totalPaginas}</div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        ${statGridHtml}
        ${podeEditar ? `
        <div class="progress-edit">
          <input type="number" id="inputPagina" min="0" max="${totalPaginas}" placeholder="pág. atual" value="${paginaAtual}">
          <button class="btn-ouro" onclick="atualizarProgresso()">Atualizar</button>
          <span class="salvando" id="salvandoProgresso"></span>
        </div>` : ''}
      </div>
    </section>` : ''}

    <section>
      <div class="section-title"><span class="section-icon">${ICONES.diario}</span>Diário de leitura</div>
      ${diarioHtml}
      ${podeEditar ? `
      <div class="diario-form">
        <input type="number" id="notaPagina" placeholder="até a página...">
        <textarea id="notaTexto" rows="2" placeholder="sua impressão sobre essa parte..."></textarea>
        <button class="btn-ouro" onclick="adicionarDiario()">Adicionar registro</button>
      </div>` : ''}
    </section>

    <section>
      <div class="section-title"><span class="section-icon">${ICONES.citacoes}</span>Citações favoritas</div>
      ${citacoesHtml}
      ${podeEditar ? `
      <div class="diario-form">
        <input type="number" id="citacaoPagina" placeholder="página...">
        <textarea id="citacaoTexto" rows="2" placeholder="a citação..."></textarea>
        <button class="btn-ouro" onclick="adicionarCitacao()">Salvar citação</button>
      </div>` : ''}
    </section>

    <section>
      <div class="section-title"><span class="section-icon">${ICONES.emprestimos}</span>Empréstimos</div>
      <div class="card-ficha">
        ${emprestimosHtml}
        ${(podeEditar && !activeLoan) ? `
        <div class="emprestimo-form">
          <input type="text" id="nomeEmprestimo" placeholder="Nome de quem vai levar">
          <button class="btn-ouro" onclick="registrarEmprestimo()">Registrar</button>
        </div>` : ''}
      </div>
    </section>

    <section>
      <div class="section-title"><span class="section-icon">${ICONES.loja}</span>Onde encontrar</div>
      ${precoHtml}
    </section>

    <footer>biblioteca pessoal · página gerada a partir do catálogo</footer>
  `;
}

function toggleEditarCabecalho(){
  editandoCabecalho = !editandoCabecalho;
  render();
}

async function salvarCabecalho(){
  const titulo = document.getElementById('inputTitulo').value.trim();
  if(!titulo) return;
  const autor = document.getElementById('inputAutor').value.trim();
  const sinopse = document.getElementById('inputSinopse').value.trim();
  const capaUrl = document.getElementById('inputCapa').value.trim();
  await salvar({ titulo, autor, sinopse, capaUrl });
  Object.assign(livroAtual, { titulo, autor, sinopse, capaUrl });
  editandoCabecalho = false;
  render();
}

async function definirStatus(novo){
  const status = (livroAtual.status === novo) ? null : novo;
  await salvar({ status });
  livroAtual.status = status;
  render();
}

async function avaliar(n){
  const avaliacao = (livroAtual.avaliacao === n) ? 0 : n;
  await salvar({ avaliacao });
  livroAtual.avaliacao = avaliacao;
  render();
}

async function salvarTags(){
  const bruto = document.getElementById('inputTags').value;
  const tags = bruto.split(',').map(t => t.trim()).filter(Boolean);
  await salvar({ tags });
  livroAtual.tags = tags;
  render();
}

async function atualizarProgresso(){
  const val = parseInt(document.getElementById('inputPagina').value, 10) || 0;
  const diario = livroAtual.diario || [];
  const novo = [...diario, { data: hoje(), paginaAte: val, nota: '' }];
  await salvar({ diario: novo });
  livroAtual.diario = novo;
  render();
}

async function adicionarDiario(){
  const pagina = parseInt(document.getElementById('notaPagina').value, 10) || 0;
  const nota = document.getElementById('notaTexto').value.trim();
  if(!nota && !pagina) return;
  const diario = [...(livroAtual.diario||[]), { data: hoje(), paginaAte: pagina, nota }];
  await salvar({ diario });
  livroAtual.diario = diario;
  render();
}

async function apagarDiario(idx){
  if(!confirm('Apagar este registro do diário?')) return;
  const diario = (livroAtual.diario||[]).filter((_,i) => i!==idx);
  await salvar({ diario });
  livroAtual.diario = diario;
  render();
}

async function adicionarCitacao(){
  const pagina = parseInt(document.getElementById('citacaoPagina').value, 10) || 0;
  const texto = document.getElementById('citacaoTexto').value.trim();
  if(!texto) return;
  const citacoes = [...(livroAtual.citacoes||[]), { data: hoje(), pagina, texto }];
  await salvar({ citacoes });
  livroAtual.citacoes = citacoes;
  render();
}

async function apagarCitacao(idx){
  if(!confirm('Apagar esta citação?')) return;
  const citacoes = (livroAtual.citacoes||[]).filter((_,i) => i!==idx);
  await salvar({ citacoes });
  livroAtual.citacoes = citacoes;
  render();
}

async function registrarEmprestimo(){
  const nome = document.getElementById('nomeEmprestimo').value.trim();
  if(!nome) return;
  const emprestimos = [...(livroAtual.emprestimos||[]), { nome, dataEmprestimo: hoje(), dataDevolucao: null }];
  await salvar({ emprestimos });
  livroAtual.emprestimos = emprestimos;
  render();
}

async function apagarEmprestimo(idx){
  if(!confirm('Apagar este registro de empréstimo?')) return;
  const emprestimos = (livroAtual.emprestimos||[]).filter((_,i) => i!==idx);
  await salvar({ emprestimos });
  livroAtual.emprestimos = emprestimos;
  render();
}

async function marcarDevolvido(idx){
  const emprestimos = (livroAtual.emprestimos||[]).map((e,i) => i===idx ? { ...e, dataDevolucao: hoje() } : e);
  await salvar({ emprestimos });
  livroAtual.emprestimos = emprestimos;
  render();
}

async function compartilhar(){
  const url = window.location.href;
  if(navigator.share){
    try{ await navigator.share({ title: livroAtual.titulo, text: 'Ficha do livro', url }); return; }
    catch(e){ /* usuário cancelou o share nativo, cai no fallback */ }
  }
  const btn = document.getElementById('btnCompartilhar');
  try{
    await navigator.clipboard.writeText(url);
    if(btn){ const old = btn.textContent; btn.textContent = 'link copiado!'; setTimeout(() => btn.textContent = old, 1800); }
  }catch(e){
    if(btn){ const old = btn.textContent; btn.textContent = 'erro ao copiar'; setTimeout(() => btn.textContent = old, 1800); }
  }
}

init();
</script>
</body>
</html>
