<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha do livro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3E6D2; --bg-card:#FFFAF0;
    --ink:#3B2E22; --ink-dim:#8C7B67; --line:#E8D9C0;
    --terracota:#C1652F; --terracota-dim:#8f4a22; --terracota-soft:#F1D9C7;
    --oliva:#6E7B4E; --oliva-dim:#4c5536; --oliva-soft:#E3E6D2;
    --mostarda:#C98A2B; --mostarda-dim:#8f611e; --mostarda-soft:#F5E3BE;
    --azul:#5F7C8C; --azul-dim:#3f5561; --azul-soft:#DCE6EA;
    --perigo:#A24632;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; min-height:100vh; }
  body{
    background:
      radial-gradient(ellipse 800px 420px at 12% -8%, rgba(193,101,47,.12), transparent 60%),
      radial-gradient(ellipse 700px 420px at 100% 8%, rgba(110,123,78,.10), transparent 60%),
      var(--bg);
    color:var(--ink); font-family:'DM Sans',sans-serif;
  }
  .wrap{ max-width:560px; margin:0 auto; padding:28px 20px 60px; animation:subir .5s cubic-bezier(.2,.7,.3,1); }
  @keyframes subir{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes girar{ to{ transform:rotate(360deg); } }

  .stamp-row{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px dashed var(--line); padding-bottom:16px; margin-bottom:26px; gap:10px; }
  .stamp{ font-family:'DM Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--terracota-dim); text-transform:uppercase; border:1.5px solid var(--terracota-dim); padding:5px 9px; border-radius:3px; transform:rotate(-2deg); background:var(--terracota-soft); }
  .stamp.editavel{ color:var(--oliva-dim); border-color:var(--oliva); background:var(--oliva-soft); }
  .stamp-right{ display:flex; align-items:center; gap:10px; }
  .id-num{ font-family:'DM Mono',monospace; font-size:11px; color:var(--ink-dim); }

  button{ font-family:inherit; transition:transform .12s ease, filter .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease; }
  button:active{ transform:scale(.94); }

  .compartilhar-btn{ background:var(--bg-card); border:1.5px solid var(--terracota-dim); color:var(--terracota-dim); border-radius:20px; padding:6px 13px; font-size:11px; cursor:pointer; white-space:nowrap; }
  .compartilhar-btn:hover{ background:var(--terracota-soft); }

  .btn-ouro{ background:linear-gradient(180deg, #d9834f, var(--terracota)); color:#fff8ee; border:none; border-radius:20px; padding:10px 18px; font-weight:700; cursor:pointer; font-size:13px; box-shadow:0 6px 16px -6px rgba(193,101,47,.55); }
  .btn-ouro:hover{ filter:brightness(1.06); }

  .capa-wrap{ text-align:center; margin-bottom:28px; }
  .capa-frame{ display:inline-block; background:#fffdf8; padding:10px 10px 24px; border-radius:6px; box-shadow:0 16px 32px -16px rgba(90,58,26,.4), 0 0 0 1px var(--line); transform:rotate(-2deg); }
  .capa-img{ display:block; max-width:150px; max-height:220px; border-radius:2px; }

  h1{ font-family:'Fraunces',serif; font-optical-sizing:auto; font-weight:600; font-size:42px; line-height:1.02; margin:0 0 8px; }
  .autor{ color:var(--terracota-dim); font-size:15px; margin:0 0 20px; font-weight:500; }

  .editar-toggle{ background:none; border:1.5px dashed var(--line); color:var(--ink-dim); border-radius:20px; padding:6px 13px; font-size:11px; cursor:pointer; margin:-10px 0 20px; }
  .editar-toggle:hover{ border-color:var(--terracota); color:var(--terracota-dim); }
  .editar-cabecalho{ display:flex; flex-direction:column; gap:8px; margin-bottom:24px; background:var(--bg-card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 8px 22px -14px rgba(90,58,26,.3); }
  .editar-cabecalho input, .editar-cabecalho textarea{ padding:10px 12px; background:#fff; border:1.5px solid var(--line); border-radius:10px; color:var(--ink); font-size:14px; font-family:inherit; }
  .editar-cabecalho input:focus, .editar-cabecalho textarea:focus, .diario-form input:focus, .diario-form textarea:focus, .progress-edit input:focus, .emprestimo-form input:focus, .tags-edit input:focus{ outline:none; border-color:var(--terracota); box-shadow:0 0 0 3px var(--terracota-soft); }
  .editar-cabecalho textarea{ min-height:70px; }
  .editar-cabecalho label{ font-family:'DM Mono',monospace; font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; }
  .editar-cabecalho button{ align-self:flex-start; }

  .sinopse{ font-size:15.5px; line-height:1.7; margin-bottom:26px; color:#4a3c2d; }

  .status-pills{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .status-pill{ font-family:'DM Mono',monospace; font-size:11px; padding:7px 15px; border-radius:20px; border:1.5px solid var(--line); color:var(--ink-dim); background:var(--bg-card); }
  .status-pill.clicavel{ cursor:pointer; }
  .status-pill.clicavel:hover:not(.ativo){ border-color:var(--ink-dim); color:var(--ink); }
  .status-pill--quero-ler.ativo{ background:var(--azul); border-color:var(--azul); color:#fff; font-weight:700; }
  .status-pill--lendo.ativo{ background:var(--terracota); border-color:var(--terracota); color:#fff; font-weight:700; }
  .status-pill--lido.ativo{ background:var(--oliva); border-color:var(--oliva); color:#fff; font-weight:700; }

  .estrelas{ display:flex; gap:5px; margin-bottom:18px; font-size:22px; line-height:1; }
  .estrela{ color:#e6d9c2; transition:color .12s ease, transform .12s ease; }
  .estrela.cheia{ color:var(--mostarda); text-shadow:0 0 10px rgba(201,138,43,.35); }
  .estrela.clicavel{ cursor:pointer; }
  .estrela.clicavel:hover{ transform:scale(1.2); }

  .tags-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .tag{ font-family:'DM Mono',monospace; font-size:11px; padding:4px 12px; border-radius:20px; border:1px solid transparent; }
  .tag:nth-child(3n+1){ background:var(--terracota-soft); color:var(--terracota-dim); }
  .tag:nth-child(3n+2){ background:var(--oliva-soft); color:var(--oliva-dim); }
  .tag:nth-child(3n){ background:var(--mostarda-soft); color:var(--mostarda-dim); }
  .tags-edit{ display:flex; gap:8px; margin-bottom:26px; }
  .tags-edit input{ flex:1; padding:9px 12px; background:var(--bg-card); border:1.5px solid var(--line); border-radius:10px; color:var(--ink); font-size:13px; }
  .tags-edit button{ background:var(--terracota); color:#fff; border:none; border-radius:20px; padding:9px 16px; font-weight:700; cursor:pointer; font-size:12px; white-space:nowrap; }

  section{ margin-bottom:36px; }
  .section-title{ font-family:'Fraunces',serif; font-optical-sizing:auto; font-weight:600; font-size:21px; color:var(--ink); margin:0 0 16px; display:flex; align-items:center; gap:11px; }
  .section-title::after{ content:''; flex:1; height:2px; background:linear-gradient(90deg, var(--line), transparent); border-radius:2px; }
  .section-icon{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .section-icon svg{ width:13px; height:13px; }
  .ic-progresso{ background:var(--oliva-soft); color:var(--oliva-dim); }
  .ic-diario{ background:var(--terracota-soft); color:var(--terracota-dim); }
  .ic-citacoes{ background:var(--mostarda-soft); color:var(--mostarda-dim); }
  .ic-emprestimos{ background:var(--azul-soft); color:var(--azul-dim); }
  .ic-loja{ background:var(--oliva-soft); color:var(--oliva-dim); }

  .progress-box{ background:var(--bg-card); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 10px 26px -16px rgba(90,58,26,.3); }
  .progress-top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
  .progress-pct{ font-family:'Fraunces',serif; font-weight:600; font-size:32px; color:var(--terracota-dim); }
  .progress-num{ font-family:'DM Mono',monospace; font-size:12px; color:var(--ink-dim); text-align:right; }
  .progress-num b{ color:var(--ink); font-weight:600; }
  .bar-track{ height:9px; background:var(--line); border-radius:5px; overflow:hidden; }
  .bar-fill{ height:100%; background:linear-gradient(90deg, var(--oliva), var(--mostarda)); border-radius:5px; transition:width .6s cubic-bezier(.2,.8,.2,1); }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
  .stat-chip{ background:#fbf1e2; border:1px solid var(--line); border-radius:12px; padding:9px 6px; text-align:center; }
  .stat-valor{ font-family:'DM Mono',monospace; font-size:14px; color:var(--terracota-dim); font-weight:500; display:block; }
  .stat-legenda{ font-size:9px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.5px; margin-top:3px; display:block; }
  .progress-edit{ display:flex; gap:8px; margin-top:16px; align-items:center; }
  .progress-edit input{ width:80px; padding:9px 10px; background:#fff; border:1.5px solid var(--line); border-radius:10px; color:var(--ink); font-size:14px; }
  .progress-edit button{ padding:9px 15px; font-size:13px; }

  .diario-item, .citacao-item{ display:flex; gap:14px; padding:14px 6px; border-bottom:1px solid var(--line); border-radius:8px; }
  .diario-item:hover, .citacao-item:hover{ background:rgba(193,101,47,.05); }
  .diario-item:last-child, .citacao-item:last-child{ border-bottom:none; }
  .diario-data{ font-family:'DM Mono',monospace; font-size:11px; color:var(--terracota-dim); white-space:nowrap; padding-top:2px; }
  .diario-nota{ font-size:14px; line-height:1.5; }
  .diario-pag{ display:block; font-size:11px; color:var(--ink-dim); margin-top:4px; }
  .diario-form{ margin-top:16px; display:flex; flex-direction:column; gap:9px; }
  .diario-form input, .diario-form textarea{ padding:10px 12px; background:var(--bg-card); border:1.5px solid var(--line); border-radius:12px; color:var(--ink); font-size:14px; font-family:inherit; }
  .diario-form button{ align-self:flex-start; padding:9px 17px; font-size:13px; }

  .citacao-item{ flex-direction:column; gap:4px; padding:14px 6px; }
  .citacao-texto{ font-family:'Fraunces',serif; font-size:16px; line-height:1.6; font-style:italic; color:#4a3c2d; }
  .citacao-texto::before{ content:'\201C'; color:var(--mostarda-dim); }
  .citacao-texto::after{ content:'\201D'; color:var(--mostarda-dim); }
  .citacao-pag{ display:block; font-size:11px; color:var(--ink-dim); font-style:normal; font-family:'DM Sans',sans-serif; }

  .card-ficha{ background:var(--bg-card); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:0 10px 26px -16px rgba(90,58,26,.3); }
  .ficha-row{ display:flex; justify-content:space-between; align-items:center; padding:14px 17px; font-size:13px; border-bottom:1px solid var(--line); }
  .ficha-row:last-child{ border-bottom:none; }
  .ficha-status{ font-family:'DM Mono',monospace; font-size:11px; display:flex; align-items:center; gap:8px; }
  .status-fora{ color:var(--terracota-dim); font-weight:500; }
  .status-devolvido{ color:var(--ink-dim); }
  .vazio{ color:var(--ink-dim); font-size:13px; font-style:italic; padding:16px 17px; }
  .emprestimo-form{ display:flex; gap:8px; padding:13px 17px; }
  .emprestimo-form input{ flex:1; padding:9px 11px; background:#fff; border:1.5px solid var(--line); border-radius:10px; color:var(--ink); font-size:13px; }
  .emprestimo-form button{ padding:9px 15px; font-size:12px; white-space:nowrap; }
  .devolver-btn{ background:none; border:1.5px solid var(--oliva); color:var(--oliva-dim); border-radius:20px; padding:4px 10px; font-size:11px; cursor:pointer; }
  .devolver-btn:hover{ background:var(--oliva-soft); }
  .apagar-btn{ background:none; border:none; color:var(--perigo); font-size:11px; cursor:pointer; text-decoration:underline; padding:0; }
  .apagar-btn:hover{ opacity:.75; }

  .precos-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .preco-card{ background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:15px 10px; text-align:center; transition:border-color .15s ease, transform .15s ease; box-shadow:0 8px 20px -14px rgba(90,58,26,.28); }
  .preco-card:has(a[href]:not([href="#"])):hover{ border-color:var(--terracota); transform:translateY(-2px); }
  .preco-loja{ font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-dim); margin-bottom:7px; }
  .preco-valor{ font-family:'DM Mono',monospace; font-size:15px; color:var(--terracota-dim); font-weight:500; }
  .preco-card a{ text-decoration:none; color:inherit; display:block; }

  footer{ text-align:center; color:var(--ink-dim); font-size:11px; margin-top:44px; letter-spacing:.3px; }
  .loading{ display:flex; flex-direction:column; align-items:center; gap:16px; padding:110px 20px; color:var(--ink-dim); font-size:13px; font-family:'DM Mono',monospace; letter-spacing:.5px; }
  .spinner{ width:26px; height:26px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--terracota); animation:girar .8s linear infinite; }
  .erro{ text-align:center; padding:90px 20px; color:var(--ink-dim); font-size:14px; }
  .erro b{ color:var(--terracota-dim); display:block; margin-bottom:8px; font-family:'Fraunces',serif; font-weight:600; font-size:24px; }
  .salvando{ font-size:11px; color:var(--ink-dim); }
  #statusSugestoes{ font-size:12px; font-weight:500; color:var(--terracota-dim); min-height:14px; }
</style>
</head>
<body>
  <div class="wrap" id="app"><div class="loading"><div class="spinner"></div>carregando ficha do livro…</div></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const key = params.get('key');
let podeEditar = false;
let docRef, livroAtual;
let editandoCabecalho = false;
let capaAuto = null;
const infoLivroCache = new Map();

const STATUS_LABEL = { 'quero-ler':'Quero ler', 'lendo':'Lendo', 'lido':'Lido' };

const ICONES = {
  progresso: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 0 1 2-2h13v16"/><path d="M4 19a2 2 0 0 0 2 2h14"/><path d="M4 19a2 2 0 0 1 2-2h14"/></svg>',
  diario: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  citacoes: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.2 6C4.4 7.4 3 9.6 3 12.4c0 2.1 1.2 3.6 3 3.6 1.6 0 2.8-1.2 2.8-2.8 0-1.5-1-2.6-2.4-2.7.3-1.6 1.5-2.9 3.1-3.6L7.2 6Zm9 0c-2.8 1.4-4.2 3.6-4.2 6.4 0 2.1 1.2 3.6 3 3.6 1.6 0 2.8-1.2 2.8-2.8 0-1.5-1-2.6-2.4-2.7.3-1.6 1.5-2.9 3.1-3.6L16.2 6Z"/></svg>',
  emprestimos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m17 3 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 21-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
  loja: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 4.5 4h15L21 9.5"/><path d="M3 9.5h18v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5Z"/><path d="M9 21v-5h6v5"/></svg>'
};

function escapeHtml(s){
  return String(s==null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function sha256(texto){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function formatarData(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function hoje(){ return new Date().toISOString().slice(0,10); }

async function salvar(campos){
  try{
    await docRef.update({ ...campos, chaveHash: livroAtual.chaveHash });
  }catch(e){
    alert('Não foi possível salvar essa alteração. O Firestore recusou a gravação (provavelmente as regras de segurança ainda não liberam esse campo).');
    throw e;
  }
}

async function init(){
  const app = document.getElementById('app');
  if(!id){
    app.innerHTML = '<div class="erro"><b>Nenhum livro informado</b>Adicione ?id=slug-do-livro ao link.</div>';
    return;
  }
  docRef = db.collection('livros').doc(id);
  let snap;
  try{ snap = await docRef.get(); }
  catch(e){
    app.innerHTML = '<div class="erro"><b>Não foi possível carregar</b>Verifique a configuração do Firebase.</div>';
    return;
  }
  if(!snap.exists){
    app.innerHTML = '<div class="erro"><b>Livro não encontrado</b>Não há registro para "'+id+'".</div>';
    return;
  }
  livroAtual = snap.data();

  if(key){
    const hash = await sha256(key);
    podeEditar = (hash === livroAtual.chaveHash);
  }

  render();
  tentarCapaAutomatica();
}

async function buscarInfoGoogleBooks(titulo, autor){
  try{
    const q = encodeURIComponent(`intitle:${titulo} inauthor:${autor||''}`);
    const resp = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${q}&maxResults=1`);
    const json = await resp.json();
    return (json.items && json.items[0] && json.items[0].volumeInfo) || null;
  }catch(e){ return null; } // sem chave de API, o Google às vezes recusa (429) — segue sem essa fonte
}

async function buscarInfoOpenLibrary(titulo, autor){
  try{
    const q = new URLSearchParams({ title: titulo, author: autor||'', limit: '1' });
    const resp = await fetch(`https://openlibrary.org/search.json?${q}`);
    const json = await resp.json();
    return (json.docs && json.docs[0]) || null;
  }catch(e){ return null; } // sem internet ou API fora do ar, tudo bem
}

async function buscarPaginaWikipedia(srsearch){
  const busca = new URLSearchParams({ action: 'query', list: 'search', format: 'json', origin: '*', srsearch, srlimit: '1' });
  const resp = await fetch(`https://pt.wikipedia.org/w/api.php?${busca}`);
  const json = await resp.json();
  return (json.query && json.query.search && json.query.search[0] && json.query.search[0].title) || null;
}

async function buscarInfoWikipedia(titulo, autor){
  try{
    // Tenta primeiro um match exato de título (o mais confiável pra achar o
    // artigo certo); se não achar, cai pra uma busca mais solta com o autor.
    const pagina = await buscarPaginaWikipedia(`intitle:"${titulo}"`)
      || await buscarPaginaWikipedia(`${titulo} ${autor||''}`.trim());
    if(!pagina) return null;

    const resumoResp = await fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(pagina)}`);
    const resumoJson = await resumoResp.json();
    return resumoJson.extract ? { descricao: resumoJson.extract } : null;
  }catch(e){ return null; } // sem internet, sem página correspondente, tudo bem
}

// Combina três fontes gratuitas e sem chave de API:
// Wikipédia PT (melhor sinopse, em português) > Google Books (sinopse/gênero
// como alternativa, quando não recusa a busca anônima) > Open Library (não
// tem cota nenhuma, por isso é a fonte principal pra capa/páginas).
async function buscarInfoLivro(titulo, autor){
  const chave = `${titulo}|${autor||''}`;
  if(infoLivroCache.has(chave)) return infoLivroCache.get(chave);

  const [google, openLib, wikipedia] = await Promise.all([
    buscarInfoGoogleBooks(titulo, autor),
    buscarInfoOpenLibrary(titulo, autor),
    buscarInfoWikipedia(titulo, autor)
  ]);

  const capaGoogle = google && google.imageLinks && google.imageLinks.thumbnail
    ? google.imageLinks.thumbnail.replace('http://','https://') : null;
  const capaOpenLibrary = openLib && openLib.cover_i
    ? `https://covers.openlibrary.org/b/id/${openLib.cover_i}-L.jpg` : null;

  const info = {
    descricao: (wikipedia && wikipedia.descricao) || (google && google.description) || null,
    paginas: (openLib && openLib.number_of_pages_median) || (google && google.pageCount) || null,
    capa: capaOpenLibrary || capaGoogle,
    generos: (google && google.categories && google.categories.length)
      ? [...new Set(google.categories.flatMap(c => c.split(' / ').map(s => s.trim())))]
      : (openLib && openLib.subject ? openLib.subject.slice(0, 5) : [])
  };
  infoLivroCache.set(chave, info);
  return info;
}

async function tentarCapaAutomatica(){
  if(!livroAtual || livroAtual.capaUrl || capaAuto || !livroAtual.titulo) return;
  const info = await buscarInfoLivro(livroAtual.titulo, livroAtual.autor);
  if(info.capa){ capaAuto = info.capa; render(); }
}

async function buscarSugestoes(){
  const status = document.getElementById('statusSugestoes');
  const titulo = document.getElementById('inputTitulo').value.trim();
  const autor = document.getElementById('inputAutor').value.trim();
  if(!titulo){ if(status) status.textContent = 'Preencha o título antes de buscar.'; return; }
  if(status) status.textContent = 'Buscando na Open Library e no Google Books…';

  const info = await buscarInfoLivro(titulo, autor);

  let preenchidos = [];
  let naoEncontrados = [];

  const campoSinopse = document.getElementById('inputSinopse');
  if(!campoSinopse.value.trim()){
    if(info.descricao){ campoSinopse.value = info.descricao; preenchidos.push('sinopse'); }
    else naoEncontrados.push('sinopse');
  }

  const campoPaginas = document.getElementById('inputTotalPaginas');
  if(!campoPaginas.value || campoPaginas.value === '0'){
    if(info.paginas){ campoPaginas.value = info.paginas; preenchidos.push('total de páginas'); }
    else naoEncontrados.push('total de páginas');
  }

  const campoCapa = document.getElementById('inputCapa');
  if(!campoCapa.value.trim()){
    if(info.capa){ campoCapa.value = info.capa; preenchidos.push('capa'); }
    else naoEncontrados.push('capa');
  }

  const campoTags = document.getElementById('inputTags');
  if(campoTags && !campoTags.value.trim()){
    if(info.generos.length){ campoTags.value = info.generos.join(', '); preenchidos.push('gêneros'); }
    else naoEncontrados.push('gêneros');
  }

  if(status){
    const partes = [];
    if(preenchidos.length) partes.push(`Preenchi: ${preenchidos.join(', ')}.`);
    if(naoEncontrados.length) partes.push(`Não encontrei ${naoEncontrados.join(', ')} em nenhuma fonte gratuita — preencha manualmente.`);
    status.textContent = partes.length ? partes.join(' ') : 'Todos os campos já estavam preenchidos.';
    if(preenchidos.length) status.textContent += ' Revise e clique em "Salvar tudo".';
  }
}

function render(){
  const livro = livroAtual;
  const app = document.getElementById('app');
  const ultimaLeitura = (livro.diario && livro.diario.length) ? livro.diario[livro.diario.length-1] : null;
  const paginaAtual = ultimaLeitura ? ultimaLeitura.paginaAte : 0;
  const totalPaginas = livro.totalPaginas || 0;
  const pct = totalPaginas ? Math.min(100, Math.round((paginaAtual/totalPaginas)*100)) : 0;

  const capaSrc = livro.capaUrl || capaAuto;
  const capaHtml = capaSrc
    ? `<div class="capa-wrap"><div class="capa-frame"><img class="capa-img" src="${escapeHtml(capaSrc)}" alt="Capa de ${escapeHtml(livro.titulo)}" onerror="this.closest('.capa-wrap').style.display='none'"></div></div>`
    : '';

  const cabecalhoHtml = editandoCabecalho ? `
    <div class="editar-cabecalho">
      <label>Título</label>
      <input type="text" id="inputTitulo" value="${escapeHtml(livro.titulo)}">
      <label>Autor</label>
      <input type="text" id="inputAutor" value="${escapeHtml(livro.autor||'')}">
      <label>Sinopse</label>
      <textarea id="inputSinopse">${escapeHtml(livro.sinopse||'')}</textarea>
      <label>URL da capa (opcional — deixe em branco para buscar automaticamente)</label>
      <input type="text" id="inputCapa" value="${escapeHtml(livro.capaUrl||'')}">
      <label>Total de páginas (0 = esconde a seção de progresso)</label>
      <input type="number" id="inputTotalPaginas" min="0" value="${livro.totalPaginas||0}">
      <label>Gêneros (separados por vírgula)</label>
      <input type="text" id="inputTags" value="${escapeHtml((livro.tags||[]).join(', '))}">
      <button class="editar-toggle" type="button" onclick="buscarSugestoes()">✨ buscar sinopse, capa, páginas e gênero automaticamente</button>
      <span class="salvando" id="statusSugestoes"></span>
      <button class="btn-ouro" onclick="salvarCabecalho()">Salvar tudo</button>
    </div>`
    : `
    <h1>${escapeHtml(livro.titulo)}</h1>
    <p class="autor">${escapeHtml(livro.autor||'')}</p>
    ${podeEditar ? `<button class="editar-toggle" onclick="toggleEditarCabecalho()">✎ editar título, autor, sinopse e capa</button>` : ''}
    ${livro.sinopse ? `<p class="sinopse">${escapeHtml(livro.sinopse)}</p>` : ''}
  `;

  const statusAtual = livro.status;
  const statusHtml = podeEditar
    ? `<div class="status-pills">${Object.keys(STATUS_LABEL).map(s =>
        `<button class="status-pill clicavel status-pill--${s} ${statusAtual===s?'ativo':''}" onclick="definirStatus('${s}')">${STATUS_LABEL[s]}</button>`
      ).join('')}</div>`
    : (statusAtual ? `<div class="status-pills"><span class="status-pill ativo status-pill--${statusAtual}">${STATUS_LABEL[statusAtual]||escapeHtml(statusAtual)}</span></div>` : '');

  const avaliacao = livro.avaliacao || 0;
  const estrelasHtml = (podeEditar || avaliacao > 0) ? `
    <div class="estrelas">
      ${[1,2,3,4,5].map(n => `<span class="estrela ${n<=avaliacao?'cheia':''} ${podeEditar?'clicavel':''}" ${podeEditar?`onclick="avaliar(${n})"`:''}>★</span>`).join('')}
    </div>` : '';

  const tags = livro.tags || [];
  const tagsRowHtml = (tags.length && !editandoCabecalho) ? `<div class="tags-row">${tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : '';

  let statChips = [];
  if(totalPaginas){
    statChips.push({ valor: Math.max(0, totalPaginas - paginaAtual), legenda: 'páginas restantes' });
    if(livro.diario && livro.diario.length >= 2){
      const primeira = livro.diario[0];
      const ultima = livro.diario[livro.diario.length-1];
      const dias = Math.max(1, Math.round((new Date(ultima.data) - new Date(primeira.data)) / 86400000));
      const paginasLidas = ultima.paginaAte - primeira.paginaAte;
      const mediaPorDia = paginasLidas / dias;
      if(mediaPorDia > 0){
        statChips.push({ valor: mediaPorDia.toFixed(1), legenda: 'páginas/dia' });
        const restante = totalPaginas - paginaAtual;
        const diasRestantes = Math.ceil(restante / mediaPorDia);
        const previsao = new Date(Date.now() + diasRestantes * 86400000).toISOString().slice(0,10);
        statChips.push({ valor: formatarData(previsao), legenda: 'previsão de término' });
      }
    }
  }
  const statGridHtml = statChips.length ? `
    <div class="stat-grid">
      ${statChips.map(s => `<div class="stat-chip"><span class="stat-valor">${escapeHtml(String(s.valor))}</span><span class="stat-legenda">${s.legenda}</span></div>`).join('')}
    </div>` : '';

  const diarioHtml = (livro.diario && livro.diario.length)
    ? livro.diario.map((d, idxReal) => `
        <div class="diario-item">
          <div class="diario-data">${formatarData(d.data)}</div>
          <div class="diario-nota">${escapeHtml(d.nota||'')}<span class="diario-pag">até a página ${d.paginaAte}
            ${podeEditar ? ` · <button class="apagar-btn" onclick="apagarDiario(${idxReal})">apagar</button>` : ''}
          </span></div>
        </div>`).reverse().join('')
    : '<div class="vazio">Nenhum registro de leitura ainda.</div>';

  const citacoesHtml = (livro.citacoes && livro.citacoes.length)
    ? livro.citacoes.map((c, idxReal) => `
        <div class="citacao-item">
          <div class="citacao-texto">${escapeHtml(c.texto||'')}</div>
          <span class="citacao-pag">página ${c.pagina||'?'}
            ${podeEditar ? ` · <button class="apagar-btn" onclick="apagarCitacao(${idxReal})">apagar</button>` : ''}
          </span>
        </div>`).reverse().join('')
    : '<div class="vazio">Nenhuma citação salva ainda.</div>';

  const activeLoan = (livro.emprestimos||[]).find(e => !e.dataDevolucao);
  const emprestimosHtml = (livro.emprestimos && livro.emprestimos.length)
    ? livro.emprestimos.slice().map((e, idxReal) => {
        return `<div class="ficha-row">
          <span>${escapeHtml(e.nome)}</span>
          <span class="ficha-status ${e.dataDevolucao?'status-devolvido':'status-fora'}">
            ${e.dataDevolucao ? 'devolvido em '+formatarData(e.dataDevolucao) : 'desde '+formatarData(e.dataEmprestimo)}
            ${(!e.dataDevolucao && podeEditar) ? `<button class="devolver-btn" onclick="marcarDevolvido(${idxReal})">devolvido</button>` : ''}
            ${podeEditar ? `<button class="apagar-btn" onclick="apagarEmprestimo(${idxReal})">apagar</button>` : ''}
          </span>
        </div>`;
      }).reverse().join('')
    : '<div class="vazio">Este exemplar nunca foi emprestado.</div>';

  const c = livro.catalogo || {};
  const precoHtml = `<div class="precos-grid">
    <div class="preco-card"><a href="${c.linkAmazon||'#'}" target="_blank" rel="noopener"><div class="preco-loja">Amazon</div><div class="preco-valor">${escapeHtml(c.amazon||'—')}</div></a></div>
    <div class="preco-card"><a href="${c.linkTravessa||'#'}" target="_blank" rel="noopener"><div class="preco-loja">Travessa</div><div class="preco-valor">${escapeHtml(c.travessa||'—')}</div></a></div>
    <div class="preco-card"><a href="${c.linkEstanteVirtual||'#'}" target="_blank" rel="noopener"><div class="preco-loja">Est. Virtual</div><div class="preco-valor">${escapeHtml(c.estanteVirtual||'—')}</div></a></div>
  </div>`;

  app.innerHTML = `
    <div class="stamp-row">
      <div class="stamp ${podeEditar?'editavel':''}">${podeEditar ? 'edição liberada' : 'ficha de biblioteca'}</div>
      <div class="stamp-right">
        <div class="id-num">Nº ${id}</div>
        <button class="compartilhar-btn" id="btnCompartilhar" onclick="compartilhar()">compartilhar</button>
      </div>
    </div>

    ${capaHtml}
    ${cabecalhoHtml}
    ${statusHtml}
    ${estrelasHtml}
    ${tagsRowHtml}

    ${totalPaginas ? `
    <section>
      <div class="section-title"><span class="section-icon ic-progresso">${ICONES.progresso}</span>Progresso de leitura</div>
      <div class="progress-box">
        <div class="progress-top">
          <div class="progress-pct">${pct}%</div>
          <div class="progress-num">página <b>${paginaAtual}</b> de ${totalPaginas}</div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        ${statGridHtml}
        ${podeEditar ? `
        <div class="progress-edit">
          <input type="number" id="inputPagina" min="0" max="${totalPaginas}" placeholder="pág. atual" value="${paginaAtual}">
          <button class="btn-ouro" onclick="atualizarProgresso()">Atualizar</button>
          <span class="salvando" id="salvandoProgresso"></span>
        </div>` : ''}
      </div>
    </section>` : ''}

    <section>
      <div class="section-title"><span class="section-icon ic-diario">${ICONES.diario}</span>Diário de leitura</div>
      ${diarioHtml}
      ${podeEditar ? `
      <div class="diario-form">
        <input type="number" id="notaPagina" placeholder="até a página...">
        <textarea id="notaTexto" rows="2" placeholder="sua impressão sobre essa parte..."></textarea>
        <button class="btn-ouro" onclick="adicionarDiario()">Adicionar registro</button>
      </div>` : ''}
    </section>

    <section>
      <div class="section-title"><span class="section-icon ic-citacoes">${ICONES.citacoes}</span>Citações favoritas</div>
      ${citacoesHtml}
      ${podeEditar ? `
      <div class="diario-form">
        <input type="number" id="citacaoPagina" placeholder="página...">
        <textarea id="citacaoTexto" rows="2" placeholder="a citação..."></textarea>
        <button class="btn-ouro" onclick="adicionarCitacao()">Salvar citação</button>
      </div>` : ''}
    </section>

    <section>
      <div class="section-title"><span class="section-icon ic-emprestimos">${ICONES.emprestimos}</span>Empréstimos</div>
      <div class="card-ficha">
        ${emprestimosHtml}
        ${(podeEditar && !activeLoan) ? `
        <div class="emprestimo-form">
          <input type="text" id="nomeEmprestimo" placeholder="Nome de quem vai levar">
          <button class="btn-ouro" onclick="registrarEmprestimo()">Registrar</button>
        </div>` : ''}
      </div>
    </section>

    <section>
      <div class="section-title"><span class="section-icon ic-loja">${ICONES.loja}</span>Onde encontrar</div>
      ${precoHtml}
    </section>

    <footer>biblioteca pessoal · página gerada a partir do catálogo</footer>
  `;
}

function toggleEditarCabecalho(){
  editandoCabecalho = !editandoCabecalho;
  render();
}

async function salvarCabecalho(){
  const titulo = document.getElementById('inputTitulo').value.trim();
  if(!titulo) return;
  const autor = document.getElementById('inputAutor').value.trim();
  const sinopse = document.getElementById('inputSinopse').value.trim();
  const capaUrl = document.getElementById('inputCapa').value.trim();
  const totalPaginas = parseInt(document.getElementById('inputTotalPaginas').value, 10) || 0;
  const tags = document.getElementById('inputTags').value.split(',').map(t => t.trim()).filter(Boolean);
  await salvar({ titulo, autor, sinopse, capaUrl, totalPaginas, tags });
  Object.assign(livroAtual, { titulo, autor, sinopse, capaUrl, totalPaginas, tags });
  editandoCabecalho = false;
  render();
}

async function definirStatus(novo){
  const status = (livroAtual.status === novo) ? null : novo;
  await salvar({ status });
  livroAtual.status = status;
  render();
}

async function avaliar(n){
  const avaliacao = (livroAtual.avaliacao === n) ? 0 : n;
  await salvar({ avaliacao });
  livroAtual.avaliacao = avaliacao;
  render();
}

async function atualizarProgresso(){
  const val = parseInt(document.getElementById('inputPagina').value, 10) || 0;
  const diario = livroAtual.diario || [];
  const novo = [...diario, { data: hoje(), paginaAte: val, nota: '' }];
  await salvar({ diario: novo });
  livroAtual.diario = novo;
  render();
}

async function adicionarDiario(){
  const pagina = parseInt(document.getElementById('notaPagina').value, 10) || 0;
  const nota = document.getElementById('notaTexto').value.trim();
  if(!nota && !pagina) return;
  const diario = [...(livroAtual.diario||[]), { data: hoje(), paginaAte: pagina, nota }];
  await salvar({ diario });
  livroAtual.diario = diario;
  render();
}

async function apagarDiario(idx){
  if(!confirm('Apagar este registro do diário?')) return;
  const diario = (livroAtual.diario||[]).filter((_,i) => i!==idx);
  await salvar({ diario });
  livroAtual.diario = diario;
  render();
}

async function adicionarCitacao(){
  const pagina = parseInt(document.getElementById('citacaoPagina').value, 10) || 0;
  const texto = document.getElementById('citacaoTexto').value.trim();
  if(!texto) return;
  const citacoes = [...(livroAtual.citacoes||[]), { data: hoje(), pagina, texto }];
  await salvar({ citacoes });
  livroAtual.citacoes = citacoes;
  render();
}

async function apagarCitacao(idx){
  if(!confirm('Apagar esta citação?')) return;
  const citacoes = (livroAtual.citacoes||[]).filter((_,i) => i!==idx);
  await salvar({ citacoes });
  livroAtual.citacoes = citacoes;
  render();
}

async function registrarEmprestimo(){
  const nome = document.getElementById('nomeEmprestimo').value.trim();
  if(!nome) return;
  const emprestimos = [...(livroAtual.emprestimos||[]), { nome, dataEmprestimo: hoje(), dataDevolucao: null }];
  await salvar({ emprestimos });
  livroAtual.emprestimos = emprestimos;
  render();
}

async function apagarEmprestimo(idx){
  if(!confirm('Apagar este registro de empréstimo?')) return;
  const emprestimos = (livroAtual.emprestimos||[]).filter((_,i) => i!==idx);
  await salvar({ emprestimos });
  livroAtual.emprestimos = emprestimos;
  render();
}

async function marcarDevolvido(idx){
  const emprestimos = (livroAtual.emprestimos||[]).map((e,i) => i===idx ? { ...e, dataDevolucao: hoje() } : e);
  await salvar({ emprestimos });
  livroAtual.emprestimos = emprestimos;
  render();
}

async function compartilhar(){
  const url = window.location.href;
  if(navigator.share){
    try{ await navigator.share({ title: livroAtual.titulo, text: 'Ficha do livro', url }); return; }
    catch(e){ /* usuário cancelou o share nativo, cai no fallback */ }
  }
  const btn = document.getElementById('btnCompartilhar');
  try{
    await navigator.clipboard.writeText(url);
    if(btn){ const old = btn.textContent; btn.textContent = 'link copiado!'; setTimeout(() => btn.textContent = old, 1800); }
  }catch(e){
    if(btn){ const old = btn.textContent; btn.textContent = 'erro ao copiar'; setTimeout(() => btn.textContent = old, 1800); }
  }
}

init();
</script>
</body>
</html>
